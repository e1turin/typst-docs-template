name: Build PDF

on:
  workflow_dispatch:
    inputs:
      document:
        description: Typst source document to compile
        required: true
        default: src/main.typ
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Typst
        uses: typst-community/setup-typst@v4

      - name: Build PDF
        env:
          TARGET_DOCUMENT: ${{ inputs.document }}
        run: typst compile "$TARGET_DOCUMENT" article.pdf

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: article-pdf
          path: article.pdf
          if-no-files-found: error
