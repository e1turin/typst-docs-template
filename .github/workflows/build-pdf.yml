name: Build PDF

on:
  workflow_dispatch:
    inputs:
      document:
        description: Typst source document to compile
        required: true
        default: src/main.typ
        type: string
      output:
        description: Name of the generated PDF file
        required: true
        type: string
      release_tag:
        description: Tag for the GitHub release that will contain the PDF
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Typst
        uses: typst-community/setup-typst@v4

      - name: Build PDF
        env:
          TARGET_DOCUMENT: ${{ inputs.document }}
          TARGET_OUTPUT: ${{ inputs.output }}
        run: typst compile "$TARGET_DOCUMENT" "$TARGET_OUTPUT"

      - name: Upload PDF as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-pdf
          path: ${{ inputs.output }}
          if-no-files-found: error

      - name: Publish PDF release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: PDF ${{ inputs.release_tag }}
          files: ${{ inputs.output }}
          generate_release_notes: true
